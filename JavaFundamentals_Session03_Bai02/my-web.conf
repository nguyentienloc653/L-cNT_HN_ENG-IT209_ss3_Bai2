server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Thư mục web root
    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        # Kiểm tra sự tồn tại của file hoặc thư mục, nếu không có sẽ trả về mã lỗi 404
        try_files $uri $uri/ =404;
    }

    # Định nghĩa trang báo lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Cấu hình location cho trang 404 với chỉ thị internal
    # 'internal' ngăn chặn client truy cập trực tiếp http://<IP>/404.html từ trình duyệt
    # Trang này chỉ được Nginx phục vụ khi có yêu cầu chuyển hướng nội bộ (internal redirect)
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
